<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>網站升級中｜Lilou 粒露</title>
<meta name="robots" content="noindex">
<meta name="description" content="Lilou 粒露網站升級中，很快就回來。訂購與詢問請透過官方 LINE 或 Instagram。">
<link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<style>
  :root { --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --brand:#5B7290; --brown:#3E2D20; --bg:#f5f6f8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
  }
  header { background: var(--brand); padding: 16px 20px; display: flex; justify-content: center; }
  header img { height: 40px; width: auto; display: block; }
  header .wordmark { color: #fff; font-weight: 900; letter-spacing: .12em; font-size: 20px; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  .card {
    width: 100%; max-width: 520px; background: #fff; border: 1px solid var(--line);
    border-radius: 28px; padding: 40px 28px 32px; text-align: center;
    box-shadow: 0 18px 40px -24px rgba(28,25,23,.25);
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px;
    background: #eef2f7; color: var(--brand); font-size: 12px; font-weight: 800; letter-spacing: .14em;
  }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }
  h1 { margin: 20px 0 6px; font-size: 28px; font-weight: 900; letter-spacing: .06em; }
  .en { margin: 0; color: #a8a29e; font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  .lead { margin: 22px 0 0; color: #44403c; font-size: 15px; line-height: 1.8; }
  .lead small { display: block; color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.7; }
  .actions { display: grid; gap: 10px; margin-top: 28px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 14px;
    font-weight: 900; font-size: 15px; letter-spacing: .06em; text-decoration: none; transition: filter .15s;
  }
  .btn:hover { filter: brightness(.95); }
  .btn svg { width: 20px; height: 20px; }
  .btn-line { background: #06C755; color: #fff; }
  .btn-ig { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  .store { margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; line-height: 1.8; }
  .store b { color: #44403c; }
  footer { background: var(--brown); color: #d6cfc7; text-align: center; font-size: 12px; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); letter-spacing: .04em; }
  @media (max-width: 480px) {
    .card { padding: 34px 20px 26px; border-radius: 24px; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
  <header>
    <img src="images/lilou-logo.svg" alt="Lilou 粒露" onerror="this.outerHTML='&lt;span class=&quot;wordmark&quot;&gt;LILOU&lt;/span&gt;'">
  </header>

  <main>
    <section class="card" aria-labelledby="title">
      <span class="badge"><span class="pulse" aria-hidden="true"></span>UPGRADING</span>
      <h1 id="title">網站升級中</h1>
      <p class="en">We'll be back soon</p>

      <p class="lead">
        為了提供更好的訂購體驗，網站正在進行升級，<br>暫時無法線上下單與查詢訂單。
        <small>已成立的訂單不受影響，會依原訂日期製作與出貨。<br>如需訂購、修改訂單或任何問題，歡迎透過官方 LINE 或 Instagram 與我們聯繫。</small>
      </p>

      <div class="actions">
        <a class="btn btn-line" href="https://lin.ee/ane79Cw" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3C6.48 3 2 6.58 2 11c0 3.96 3.6 7.27 8.46 7.9.33.07.78.22.89.5.1.26.07.66.03.92l-.14.86c-.04.26-.2 1 .88.55 1.08-.46 5.82-3.43 7.94-5.87C21.53 14.22 22 12.66 22 11c0-4.42-4.48-8-10-8Z"/></svg>
          官方 LINE 聯繫
        </a>
        <a class="btn btn-ig" href="https://www.instagram.com/lilou.official_/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          Instagram
        </a>
      </div>

      <div class="store">
        <b>Lilou 粒露｜迷你可麗露專賣</b><br>
        高雄市前鎮區景德路72巷12號<br>
        營業時間 14:00－18:00，週一、二公休
      </div>
    </section>
  </main>

  <footer>© 2026 Lilou. All rights reserved.</footer>
</body>
</html>
