const PROD_TEXT_FIELDS = ["name","name_en","image","price","stock","min_per_order","max_per_order","type","display","shipping_rule","description","ingredients","allergens","storage","weight","nutrition","origin_manufacturer"];
const prodState = { q: "", cat: "", status: "", collapsed: new Set(), orderDirty: false, savedOrder: null, editing: null, editorBaseline: "" };
const SHIPPING_LABEL = { all: "", pickup: "僅自取", delivery: "僅宅配" };

function prodCatKey(v) { return (v || "").toString().trim().toLowerCase(); }
function prodSortNum(p) { const n = Number(p.sort); return isNaN(n) || p.sort === "" ? 99999 : n; }
function prodGroups() {
  const cats = (adminData?.categories || []).slice().sort((a, b) => (Number(a.sort) || 0) - (Number(b.sort) || 0));
  const products = adminData?.products || [];
  const groups = cats.map(c => ({ key: prodCatKey(c.id), name: c.name || c.id, en: c.name_en || "", catOn: isDisplayOn(c.display), items: [] }));
  const byKey = {}; groups.forEach(g => byKey[g.key] = g);
  products.forEach((p, i) => {
    p.__i = i;
    const k = prodCatKey(p.type);
    let g = byKey[k];
    if (!g) { g = { key: k || "__none", name: k ? `${k}（找不到分類）` : "未分類", en: "", catOn: true, items: [], orphan: true }; byKey[k] = g; groups.push(g); }
    g.items.push(p);
  });
  groups.forEach(g => g.items.sort((a, b) => prodSortNum(a) - prodSortNum(b) || a.__i - b.__i));
  return groups;
}
function prodMatches(p) {
  const q = prodState.q.trim().toLowerCase();
  if (q && !((p.name || "") + " " + (p.name_en || "")).toLowerCase().includes(q)) return false;
  if (prodState.status === "ON" && !isDisplayOn(p.display)) return false;
  if (prodState.status === "OFF" && isDisplayOn(p.display)) return false;
  return true;
}
function prodMetaHtml(p) {
  const bits = [];
  if (p.price !== "" && p.price !== undefined) bits.push(`NT$${escapeHtml(p.price)}`);
  const stock = Number(p.stock || 0);
  const stockCls = stock <= 0 ? "text-red-500" : stock <= 5 ? "text-amber-600" : "";
  bits.push(`<span class="${stockCls}">庫存 ${escapeHtml(p.stock === "" || p.stock === undefined ? "0" : p.stock)}</span>`);
  const ship = SHIPPING_LABEL[(p.shipping_rule || "all").toString().trim().toLowerCase()];
  if (ship) bits.push(ship);
  const lim = [];
  if (Number(p.min_per_order) > 0) lim.push(`最少 ${escapeHtml(p.min_per_order)}`);
  if (Number(p.max_per_order) > 0) lim.push(`最多 ${escapeHtml(p.max_per_order)}`);
  if (lim.length) bits.push("每筆" + lim.join("／"));
  return bits.join('<span class="text-stone-300 mx-1">·</span>');
}

    <button type="button" onclick="saveProductOrder(this)" class="h-10 px-4 rounded-xl bg-white text-[#3E4F66] font-black text-sm">儲存排序</button>
  </div>`;
  renderProductList();

function renderProductList() {
  const box = document.getElementById("prodList");
  if (!box) return;
  const searching = !!(prodState.q.trim() || prodState.status);
  const groups = prodGroups().filter(g => !prodState.cat || g.key === prodState.cat);
  let html = "";
  groups.forEach(g => {
    const items = g.items.filter(prodMatches);
    if (searching && !items.length) return;
    const collapsed = !searching && prodState.collapsed.has(g.key);
    const onN = g.items.filter(p => isDisplayOn(p.display)).length;
    html += `<section class="prod-group bg-white rounded-3xl border border-stone-100 shadow-sm overflow-hidden">
      <button type="button" class="prod-group-head" onclick="toggleProductGroup('${escapeHtml(g.key)}')" aria-expanded="${!collapsed}">

          <span class="block text-base font-black text-stone-900 truncate">${escapeHtml(g.name)}${g.catOn ? "" : `<span class="ml-2 align-middle text-[10px] font-bold px-2 py-0.5 rounded-full bg-stone-100 text-stone-500">分類未顯示</span>`}</span>

        ${items.map((p, idx) => productRowHtml(p, idx, items.length, searching)).join("") || `<div class="px-4 py-6 text-center text-sm font-bold text-stone-400">這個分類還沒有商品</div>`}
      </div>`}
    </section>`;
  });
  box.innerHTML = html || `<div class="bg-white rounded-3xl border border-dashed border-stone-200 py-10 text-center text-sm font-bold text-stone-400">找不到符合的商品</div>`;
}

function productRowHtml(p, idx, total, searching) {
  const on = isDisplayOn(p.display);
  const img = (p.image || "").toString().trim();
  const nameAttr = escapeHtml(p.name || "");
  return `<div class="prod-row ${on ? "" : "is-off"}" data-prod-name="${nameAttr}" data-prod-idx="${p.__i}">

    </button>
    <button type="button" class="admin-switch ${on ? "is-on" : ""}" onclick="toggleProductDisplay(this)" aria-label="${on ? "上架中，點一下下架" : "已下架，點一下上架"}" title="${on ? "上架中" : "已下架"}"><span></span></button>
    ${searching ? "" : `<div class="prod-sort">
      <button type="button" class="prod-sort-top hidden md:inline-flex" onclick="moveProduct(this,'top')" ${idx === 0 ? "disabled" : ""} title="置頂" aria-label="置頂">⤒</button>

      <button type="button" onclick="moveProduct(this,1)" ${idx === total - 1 ? "disabled" : ""} title="往下" aria-label="往下">↓</button>

async function prodPost(payload) {
  const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(Object.assign({ token: getToken() }, payload)) });
  const data = await res.json();
  if (data.status !== "success") throw new Error(data.message || "操作失敗");
  return data;
}

async function toggleProductDisplay(btn) {
  const p = productByRow(btn);

  const name = p.name || "";
  if (!name) { showAdminToast("請先幫這項商品取名稱", "error"); return; }
  const prev = p.display;
  const next = isDisplayOn(prev) ? "FALSE" : "TRUE";
  p.display = next;
  renderProducts();
  try {
    await prodPost({ action: "adminSaveProduct", originalName: name, product: { display: next } });
    showAdminToast(`「${name}」已${next === "TRUE" ? "上架" : "下架"}`, "success", 1800);
  } catch (err) {
    p.display = prev;
    renderProducts();
    showAdminToast("切換失敗：" + err.message, "error", 4200);
  }
}

  const group = prodGroups().find(g => g.items.includes(p));
  const items = group.items;
  const i = items.indexOf(p);
  if (dir === "top") { items.splice(i, 1); items.unshift(p); }
  else {
    const j = i + dir;
    if (j < 0 || j >= items.length) return;
    [items[i], items[j]] = [items[j], items[i]];
  }
  items.forEach((x, k) => { x.sort = String((k + 1) * 10); });
  prodState.orderDirty = true;
  document.getElementById("prodOrderBar")?.classList.remove("hidden");
  renderProductList();
  const row = document.querySelector(`.prod-row[data-prod-idx="${idxKey}"]`);
  if (row) { row.classList.add("is-moved"); setTimeout(() => row.classList.remove("is-moved"), 600); }
}

function cancelProductOrder() {
  (prodState.savedOrder || []).forEach(([p, s]) => { p.sort = s; });
  prodState.savedOrder = null;
  prodState.orderDirty = false;
  renderProducts();
}

async function saveProductEditor(btn) {
  const data = collectProductEditor();
  if (!data.name) { showAdminToast("請填寫商品名稱", "error"); document.querySelector('#prodEditor [data-pe="name"]')?.focus(); return; }
  const min = Number(data.min_per_order), max = Number(data.max_per_order);
  if (min > 0 && max > 0 && min > max) { showAdminToast("每筆最少不能大於每筆最多", "error"); return; }
  const target = prodState.editing;
  const originalName = target ? (target.name || "") : "";
  const products = adminData.products || (adminData.products = []);
  if (products.some(p => p.name === data.name && p !== target)) { showAdminToast(`已經有同名的商品「${data.name}」`, "error", 3600); return; }
  if (!target) {
    const same = products.filter(p => prodCatKey(p.type) === prodCatKey(data.type));
    data.sort = String((same.reduce((m, p) => Math.max(m, prodSortNum(p) === 99999 ? 0 : prodSortNum(p)), 0)) + 10);
  }
  const restore = setButtonLoading(btn, "儲存中...");
  try {
    await prodPost({ action: "adminSaveProduct", originalName, fillBlank: !!target && !originalName, product: data });
    if (target) Object.assign(target, data);
    else products.push(data);
    if (prodState.collapsed.has(prodCatKey(data.type))) prodState.collapsed.delete(prodCatKey(data.type));
    closeProductEditor(true);
    renderProducts();
    showAdminToast(`已儲存「${data.name}」`, "success");
    const row = document.querySelector(`.prod-row[data-prod-idx="${(target || data).__i}"]`);
    if (row) { row.scrollIntoView({ block: "center", behavior: "smooth" }); row.classList.add("is-moved"); setTimeout(() => row.classList.remove("is-moved"), 900); }
  } catch (err) {
    if (restore) restore();
    showAdminToast("儲存失敗：" + err.message, "error", 4800);
  }
}

function listGroups(cfg) {
  const rows = cfg.rows();
  rows.forEach((r, i) => { r.__i = i; });
  if (!cfg.group) {
    const items = cfg.order ? cfg.order(rows) : rows.slice().sort((a, b) => rowSortNum(a) - rowSortNum(b) || a.__i - b.__i);
    return [{ key: "__all", name: "", items }];
  }
  const groups = cfg.groups().map(g => Object.assign({ items: [] }, g));
  const byKey = {}; groups.forEach(g => byKey[g.key] = g);
  rows.forEach(r => {
    const k = cfg.group(r);
    if (!byKey[k]) { byKey[k] = { key: k, name: `${k || "未分類"}（找不到分類）`, items: [] }; groups.push(byKey[k]); }
    byKey[k].items.push(r);
  });
  groups.forEach(g => g.items.sort((a, b) => rowSortNum(a) - rowSortNum(b) || a.__i - b.__i));
  return groups.filter(g => g.items.length || cfg.kind === "cakeoptions");
}

    </div>

  renderListBody(tab);

function renderListBody(tab) {
  const cfg = LIST_CONFIGS[tab], st = lsState(tab);
  const box = document.getElementById("list-" + tab);
  if (!box) return;
  const q = st.q.trim().toLowerCase();
  const match = r => !q || [cfg.title_(r), cfg.sub ? cfg.sub(r) : ""].join(" ").toLowerCase().includes(q);
  let html = "";
  listGroups(cfg).forEach(g => {
    const items = g.items.filter(match);
    if (q && !items.length) return;
    const collapsed = !q && st.collapsed.has(g.key);
    const body = items.map((r, i) => listRowHtml(tab, cfg, r, i, items.length, !!q)).join("") || `<div class="px-4 py-6 text-center text-sm font-bold text-stone-400">${g.name ? "這一組還沒有項目" : `還沒有${cfg.title}，按右上角「新增」開始`}</div>`;
    const addBtn = cfg.kind === "cakeoptions" ? `<button type="button" onclick="lsState('cakeoptions').newGroup='${g.key}';openRowEditor('cakeoptions',-1)" class="w-full py-3 text-sm font-black text-[#5B7290] border-t border-stone-100 hover:bg-stone-50">＋ 新增到這一組</button>` : "";
    html += `<section class="bg-white rounded-3xl border border-stone-100 shadow-sm overflow-hidden">
      ${g.name ? `<button type="button" class="prod-group-head" onclick="toggleListGroup('${tab}','${escapeHtml(g.key)}')">
        <span class="flex-1 min-w-0 text-left"><span class="block text-base font-black text-stone-900 truncate">${escapeHtml(g.name)}</span>${g.en ? `<span class="block text-xs font-bold text-stone-400 truncate">${escapeHtml(g.en)}</span>` : ""}</span>
        <span class="text-xs font-bold text-stone-500 whitespace-nowrap">${g.items.length} 項</span>
        <span class="prod-chevron ${collapsed ? "" : "is-open"}">▾</span>
      </button>` : ""}
      ${collapsed ? "" : `<div class="divide-y divide-stone-100 ${g.name ? "border-t border-stone-100" : ""}">${body}</div>${addBtn}`}
    </section>`;
  });
  box.innerHTML = html || `<div class="bg-white rounded-3xl border border-dashed border-stone-200 py-10 text-center text-sm font-bold text-stone-400">找不到符合的項目</div>`;
}

const SITE_URL = /^https?:/.test(location.protocol) && !/localhost|127\.0\.0\.1/.test(location.hostname) ? location.origin + "/" : "https://www.lilou.food/";
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch (e) { return false; }
}
async function copyCategoryLink(id) {
  const c = (adminData.categories || []).find(x => x.id === id);
  const url = `${SITE_URL}?tab=${encodeURIComponent(id)}`;
  const ok = await copyText(url);
  if (!ok) { window.prompt("請長按複製這個連結：", url); return; }
  showAdminToast(c && !isDisplayOn(c.display) ? "已複製，但這個分類目前「未顯示」，客人打開會看到第一個分類" : `已複製「${c ? c.name : id}」的連結`, c && !isDisplayOn(c.display) ? "info" : "success", 3200);
}

function toggleListGroup(tab, key) { const st = lsState(tab); st.collapsed.has(key) ? st.collapsed.delete(key) : st.collapsed.add(key); renderListBody(tab); }

async function toggleRowDisplay(tab, i) {
  const cfg = LIST_CONFIGS[tab], r = cfg.rows()[i];
  if (!r) return;
  const prev = r.display, next = isDisplayOn(prev) ? "FALSE" : "TRUE";
  r.display = next;
  renderListPage(tab);
  try {
    await prodPost({ action: "adminSaveRow", kind: cfg.kind, originalKey: cfg.key(r), row: { display: next } });
    showAdminToast(`「${cfg.title_(r)}」已${next === "TRUE" ? "顯示" : "隱藏"}`, "success", 1800);
    if (cfg.after) cfg.after();
  } catch (err) {
    r.display = prev; renderListPage(tab);
    showAdminToast("切換失敗：" + err.message, "error", 4200);
  }
}

function moveRow(tab, i, dir) {
  const cfg = LIST_CONFIGS[tab], st = lsState(tab), r = cfg.rows()[i];
  if (!r) return;
  if (!st.savedOrder) st.savedOrder = cfg.rows().map(x => [x, x.sort]);
  const items = listGroups(cfg).find(g => g.items.includes(r)).items;
  const at = items.indexOf(r);
  if (dir === "top") { items.splice(at, 1); items.unshift(r); }
  else { const j = at + dir; if (j < 0 || j >= items.length) return; [items[at], items[j]] = [items[j], items[at]]; }
  items.forEach((x, k) => { x.sort = String((k + 1) * 10); });
  st.orderDirty = true;
  document.getElementById("order-" + tab)?.classList.remove("hidden");
  renderListBody(tab);
  const row = document.querySelector(`#list-${tab} .prod-row[data-row-idx="${i}"]`);
  if (row) { row.classList.add("is-moved"); setTimeout(() => row.classList.remove("is-moved"), 600); }
}
function cancelRowOrder(tab) { const st = lsState(tab); (st.savedOrder || []).forEach(([r, s]) => { r.sort = s; }); st.savedOrder = null; st.orderDirty = false; renderListPage(tab); }
async function saveRowOrder(tab, btn) {
  const cfg = LIST_CONFIGS[tab], st = lsState(tab);
  const restore = setButtonLoading(btn, "儲存中...");
  try {
    await prodPost({ action: "adminSaveRowOrder", kind: cfg.kind, order: cfg.rows().map(r => ({ key: cfg.key(r), sort: r.sort })) });
    st.savedOrder = null; st.orderDirty = false;
    renderListPage(tab);
    if (cfg.after) cfg.after();
    showAdminToast("排序已儲存", "success");
  } catch (err) { if (restore) restore(); showAdminToast("儲存排序失敗：" + err.message, "error", 4200); }
}

function openRowEditor(tab, i) {
  const cfg = LIST_CONFIGS[tab], st = lsState(tab);
  if (st.orderDirty) { showAdminToast("請先儲存或取消排序變更", "info", 2600); return; }
  const isNew = !(i >= 0);
  const src = isNew ? cfg.newRow() : cfg.rows()[i];
  if (!src) return;
  st.editing = isNew ? null : src;
  let wrap = document.getElementById("rowEditor");
  if (!wrap) { wrap = document.createElement("div"); wrap.id = "rowEditor"; document.body.appendChild(wrap); }
  wrap.className = "prod-editor";
  wrap.dataset.tab = tab;
  wrap.innerHTML = `
  <div class="prod-editor-backdrop" onclick="closeRowEditor()"></div>
  <div class="prod-editor-panel" role="dialog" aria-modal="true" aria-label="${isNew ? "新增" : "編輯"}${cfg.title}">
    <header class="prod-editor-head">
      <button type="button" onclick="closeRowEditor()" class="h-10 px-3 -ml-2 rounded-xl font-black text-stone-500 hover:bg-stone-100" aria-label="關閉">✕</button>
      <h3 class="flex-1 text-base font-black text-stone-900 truncate">${isNew ? "新增" : "編輯"}${cfg.title}</h3>
      <button type="button" onclick="saveRowEditor(this)" class="h-10 px-5 rounded-xl bg-[#5B7290] text-white font-black hover:bg-[#3E4F66]">儲存</button>
    </header>
    <div class="prod-editor-body">
      ${cfg.form(src)}
      ${isNew ? "" : `<button type="button" onclick="deleteRowFromEditor()" class="w-full h-12 rounded-xl border border-red-200 bg-red-50 text-red-500 font-black hover:bg-red-100">刪除這個${cfg.title}</button>`}
    </div>
  </div>`;
  document.body.classList.add("prod-editor-open");
  requestAnimationFrame(() => wrap.classList.add("is-open"));
  st.baseline = JSON.stringify(collectRowEditor());
  if (isNew) setTimeout(() => wrap.querySelector('[data-pe="name"], [data-pe="code"]')?.focus(), 250);
}
function collectRowEditor() {
  const out = {};
  document.querySelectorAll("#rowEditor [data-pe]").forEach(el => { out[el.dataset.pe] = el.value.toString().trim(); });
  return out;
}
function closeRowEditor(force) {
  const wrap = document.getElementById("rowEditor");
  if (!wrap || !wrap.classList.contains("is-open")) return;
  const st = lsState(wrap.dataset.tab);
  if (!force && JSON.stringify(collectRowEditor()) !== st.baseline) {
    showAdminConfirm("有修改還沒儲存，確定要離開嗎？", () => closeRowEditor(true), "放棄修改？");
    return;
  }
  wrap.classList.remove("is-open");
  document.body.classList.remove("prod-editor-open");
  st.editing = null;
  setTimeout(() => { if (!wrap.classList.contains("is-open")) wrap.innerHTML = ""; }, 260);
}
async function saveRowEditor(btn) {
  const tab = document.getElementById("rowEditor").dataset.tab;
  const cfg = LIST_CONFIGS[tab], st = lsState(tab);
  const d = collectRowEditor();
  if (d.code !== undefined) d.code = d.code.replace(/\s+/g, "");
  if (d.group) d.group = d.group.toLowerCase();
  const err = cfg.validate(d);
  if (err) { showAdminToast(err, "error", 3200); return; }
  const target = st.editing;
  const rows = cfg.rows();
  const newKey = cfg.key(Object.assign({}, target || {}, d));
  if (rows.some(r => r !== target && cfg.key(r) === newKey)) { showAdminToast(`已經有同名的${cfg.title}`, "error", 3600); return; }
  if (!target && cfg.sortable) {
    const peers = cfg.group ? rows.filter(r => cfg.group(r) === cfg.group(d)) : rows;
    d.sort = String(peers.reduce((m, r) => Math.max(m, rowSortNum(r) === 99999 ? 0 : rowSortNum(r)), 0) + 10);
  }
  const restore = setButtonLoading(btn, "儲存中...");
  try {
    await prodPost({ action: "adminSaveRow", kind: cfg.kind, originalKey: target ? cfg.key(target) : "", row: d });
    if (target) Object.assign(target, d); else rows.push(d);
    closeRowEditor(true);
    renderListPage(tab);
    if (cfg.after) cfg.after();
    showAdminToast(`已儲存「${cfg.title_(d)}」`, "success");
  } catch (e) { if (restore) restore(); showAdminToast("儲存失敗：" + e.message, "error", 4800); }
}
function deleteRowFromEditor() {
  const tab = document.getElementById("rowEditor").dataset.tab;
  const cfg = LIST_CONFIGS[tab], st = lsState(tab), target = st.editing;
  if (!target) return;
  const block = cfg.beforeDelete ? cfg.beforeDelete(target) : "";
  if (block) { showAdminToast(block, "error", 4800); return; }
  showAdminConfirm(`確定要刪除「${cfg.title_(target)}」嗎？刪除後無法復原。`, async () => {
    const t = showAdminToast("刪除中...", "loading", 0);
    try {
      await prodPost({ action: "adminDeleteRow", kind: cfg.kind, key: cfg.key(target) });
      const rows = cfg.rows(); rows.splice(rows.indexOf(target), 1);
      removeAdminToast(t); closeRowEditor(true); renderListPage(tab);
      if (cfg.after) cfg.after();
      showAdminToast(`已刪除「${cfg.title_(target)}」`, "success");
    } catch (e) { removeAdminToast(t); showAdminToast("刪除失敗：" + e.message, "error", 4800); }
  }, `刪除${cfg.title}`);
}

function getCategoryOptionsHtml(selectedValue) {
  const categories = adminData?.categories || [
    { id: "combo", name: "組合商品" },
    { id: "single", name: "單品" }
  ];
  
  const currentVal = (selectedValue || "combo").toString().trim().toLowerCase();
  
  const hasCurrent = categories.some(c => c.id.toLowerCase() === currentVal);
  let options = categories.map(c => `
    <option value="${escapeHtml(c.id)}" ${c.id.toLowerCase() === currentVal ? "selected" : ""}>
      ${escapeHtml(c.name)}
    </option>
  `).join("");

  if (!hasCurrent && currentVal) {
    options += `<option value="${escapeHtml(currentVal)}" selected>${escapeHtml(currentVal)} (未知分類)</option>`;
  }
  
  return options;
}

function onPagesEditorInput(e) {
  const t = e.target;
  if (t.dataset.pageField) {
    const page = pagesDraft.pages.find(p => p.page_id === selectedPageId);
    if (page) page[t.dataset.pageField] = t.value;
    markUnsaved("pages");
  } else if (t.dataset.blockField) {
    const card = t.closest("[data-block-id]");
    if (card) setBlockField(card.dataset.blockId, t.dataset.blockField, t.value);
  }
}
function setBlockField(blockId, field, value) {
  const b = pagesDraft.blocks.find(x => x.block_id === blockId);
  if (b) { b[field] = value; markUnsaved("pages"); }
}
function selectPage(id) { selectedPageId = id; renderPagesEditor(); }
function addPage() {
  const id = "p" + Date.now().toString(36);
  pagesDraft.pages.push({ page_id: id, nav_label: "新頁面", nav_label_en: "", title: "新頁面", title_en: "", intro: "", display: "FALSE", sort: "" });
  selectedPageId = id;
  markUnsaved("pages");
  renderPagesEditor();
}
function togglePageDisplay() {
  const page = pagesDraft.pages.find(p => p.page_id === selectedPageId);
  if (!page) return;
  page.display = isDisplayOn(page.display) ? "FALSE" : "TRUE";
  markUnsaved("pages"); renderPagesEditor();
}
function movePage(dir) {
  const i = pagesDraft.pages.findIndex(p => p.page_id === selectedPageId);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= pagesDraft.pages.length) return;
  [pagesDraft.pages[i], pagesDraft.pages[j]] = [pagesDraft.pages[j], pagesDraft.pages[i]];
  markUnsaved("pages"); renderPagesEditor();
}
function deletePage() {
  const page = pagesDraft.pages.find(p => p.page_id === selectedPageId);
  if (!page) return;
  showAdminConfirm(`確定要刪除「${page.nav_label || page.title}」頁面和它的所有區塊嗎？（按儲存後才會生效）`, () => {
    pagesDraft.pages = pagesDraft.pages.filter(p => p.page_id !== selectedPageId);
    pagesDraft.blocks = pagesDraft.blocks.filter(b => b.page_id !== selectedPageId);
    selectedPageId = "";
    markUnsaved("pages"); renderPagesEditor();
  }, "刪除頁面");
}
function addPageBlock() {
  pagesDraft.blocks.push({ block_id: "b" + Date.now().toString(36), page_id: selectedPageId, title: "", title_en: "", body: "", image: "", button_text: "LINE 洽詢", button_link: "", display: "TRUE", sort: "" });
  markUnsaved("pages"); renderPagesEditor();
}
function toggleBlockDisplay(id) {
  const b = pagesDraft.blocks.find(x => x.block_id === id);
  if (!b) return;
  b.display = isDisplayOn(b.display) ? "FALSE" : "TRUE";
  markUnsaved("pages"); renderPagesEditor();
}
function moveBlock(id, dir) {
  const list = pagesDraft.blocks.filter(b => b.page_id === selectedPageId);
  const i = list.findIndex(b => b.block_id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  const a = pagesDraft.blocks.indexOf(list[i]), c = pagesDraft.blocks.indexOf(list[j]);
  [pagesDraft.blocks[a], pagesDraft.blocks[c]] = [pagesDraft.blocks[c], pagesDraft.blocks[a]];
  markUnsaved("pages"); renderPagesEditor();
}
function deleteBlock(id) {
  showAdminConfirm("確定要刪除這個區塊嗎？（按儲存後才會生效）", () => {
    pagesDraft.blocks = pagesDraft.blocks.filter(b => b.block_id !== id);
    markUnsaved("pages"); renderPagesEditor();
  }, "刪除區塊");
}
function savePages(btn) {
  const bad = pagesDraft.pages.find(p => !(p.nav_label || "").trim());
  if (bad) { showAdminToast("每個頁面都要填「導覽列名稱」。", "error", 4200); return; }
  showAdminConfirm("確定要儲存「頁面」的變更嗎？", async () => {
    const pageRows = pagesDraft.pages.map((p, i) => ({ page_id: p.page_id, nav_label: (p.nav_label || "").trim(), nav_label_en: (p.nav_label_en || "").trim(), title: (p.title || p.nav_label || "").trim(), title_en: (p.title_en || "").trim(), intro: p.intro || "", display: isDisplayOn(p.display) ? "TRUE" : "FALSE", sort: String((i + 1) * 10) }));
    const blockRows = [];
    pagesDraft.pages.forEach(p => pagesDraft.blocks.filter(b => b.page_id === p.page_id && ((b.title || "").trim() || (b.body || "").trim() || (b.image || "").trim())).forEach((b, i) => blockRows.push({ block_id: b.block_id, page_id: b.page_id, title: (b.title || "").trim(), title_en: (b.title_en || "").trim(), body: b.body || "", image: (b.image || "").trim(), button_text: (b.button_text || "").trim(), button_link: (b.button_link || "").trim(), display: isDisplayOn(b.display) ? "TRUE" : "FALSE", sort: String((i + 1) * 10) })));
    const t = showAdminToast("儲存中...", "loading", 0);
    try {
      for (const [sheetName, rows] of [["Pages", pageRows], ["PageBlocks", blockRows]]) {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "adminReplaceSheetRows", token: getToken(), sheetName, rows }) });
        const data = await res.json();
        if (data.status !== "success") throw new Error(data.message || "儲存失敗");
      }
      removeAdminToast(t);
      clearUnsaved("pages");
      showAdminToast("頁面已儲存，前台約 1 分鐘內更新", "success");
      await loadAll();
    } catch (err) {
      removeAdminToast(t);
      showAdminToast("儲存失敗：" + err.message, "error", 4200);
    }
  }, "儲存確認");
}

function settingDisplayName(name) {
  const key = (name || "").toString().trim().toLowerCase();
  if (DATE_RULE_SETTING_LABELS[key]) return DATE_RULE_SETTING_LABELS[key];
  if (key === "store_available_dates" || key === "pickup_available_dates" || key.includes("store") || key.includes("pickup") || key.includes("自取")) return "自取日期";
  if (key === "delivery_available_dates" || key.includes("delivery") || key.includes("711") || key.includes("7-11") || key.includes("店到店")) return "店到店出貨日期";
  return name || "未命名設定";
}

function getRevenueSettingsRows() { return adminData?.revenueSettings || []; }
function getRevenueSettingByMonth(month) {
  return getRevenueSettingsRows().find(row => (row.month || "").toString().trim() === month) || null;
}
function getRevenueRateForOrder(order) {
  const date = normalizeOrderDateForCompare(order.date || order.timestamp || "");
  const month = date ? date.slice(0, 7) : "";
  const setting = getRevenueSettingByMonth(month);
  const rawRate = getOrderMethodFamily(order) === "delivery" ? setting?.deliveryRate : setting?.storeRate;
  const rate = Number(rawRate);
  return { month, rate: isNaN(rate) ? 0 : rate, missing: !setting };
}

function getRevenueShareRows() {
  const startDate = document.getElementById("revenueStartDate")?.value || "";
  const endDate = document.getElementById("revenueEndDate")?.value || "";
  const methodFilter = document.getElementById("revenueMethodFilter")?.value || "";

  return (adminData.orders || []).filter(order => {
      const orderDate = normalizeOrderDateForCompare(order.date || order.timestamp || "");
      if (startDate && (!orderDate || orderDate < startDate)) return false;
      if (endDate && (!orderDate || orderDate > endDate)) return false;
      if (methodFilter && getOrderMethodFamily(order) !== methodFilter) return false;
      return true;
    }).map(order => {
      const rateInfo = getRevenueRateForOrder(order);
      const amount = parseMoneyNumber(order.total);
      const status = normalizeAdminStatus(order.orderStatus || "");
      const cancelled = status === "已取消";
      return {
        id: order.id || "", date: normalizeOrderDateForCompare(order.date || order.timestamp || ""),
        name: order.name || "", methodType: getOrderMethodType(order), methodLabel: getOrderMethodLabel(order),
        status, cancelled, amount, month: rateInfo.month,
        rate: rateInfo.rate, commission: amount * rateInfo.rate / 100, missingRate: rateInfo.missing
      };
    }).sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.id || "").localeCompare(b.id || ""));
}

function filterRevenueShare() {
  const rows = getRevenueShareRows();
  const area = document.getElementById("revenueShareResult");
  const note = document.getElementById("revenueRateNote");
  if (!area || !note) return;

  const billableRows = rows.filter(row => !row.cancelled);
  const settings = getRevenueSettingsRows();
  const months = Array.from(new Set(billableRows.map(row => row.month).filter(Boolean))).sort();
  const noteRows = months.map(month => {
    const setting = getRevenueSettingByMonth(month);
    if (!setting) return `${month}：未設定比例`;
    return `${month}：門市 ${setting.storeRate || 0}%｜店到店 ${setting.deliveryRate || 0}%`;
  });
  note.textContent = noteRows.length ? `套用比例：${noteRows.join("；")}` : (settings.length ? "此區間目前沒有可計算訂單。" : "尚未讀取到 Revenue_Settings，請確認試算表分頁名稱與欄位。");

  const summary = { store: { label: "門市自取", count: 0, amount: 0, commission: 0 }, delivery: { label: "7-11店到店", count: 0, amount: 0, commission: 0 } };
  billableRows.forEach(row => {
    const target = row.methodType === "store" ? summary.store : summary.delivery;
    target.count += 1; target.amount += row.amount; target.commission += row.commission;
  });

  const totalAmount = billableRows.reduce((sum, row) => sum + row.amount, 0);
  const totalCommission = billableRows.reduce((sum, row) => sum + row.commission, 0);
  const cancelledCount = rows.length - billableRows.length;
  area.innerHTML = `
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      ${revenueShareKpi("訂單數", billableRows.length + " 筆", "不含已取消")}
      ${revenueShareKpi("總營業額", formatCurrency(totalAmount), "依篩選區間")}
      ${revenueShareKpi("預估分潤", formatCurrency(totalCommission), "依每月比例")}
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${revenueMethodCard(summary.store)}${revenueMethodCard(summary.delivery)}</div>
    <div class="bg-white rounded-3xl border border-stone-100 shadow-sm p-4 md:p-5">
      <div class="flex items-center justify-between gap-3 mb-3"><h3 class="font-black text-[#5B7290] tracking-widest">分潤明細</h3><span class="text-xs font-black text-stone-400">${rows.length} 筆${cancelledCount ? `（含已取消 ${cancelledCount} 筆）` : ""}</span></div>
      ${rows.length ? `
        <div class="overflow-x-auto">
          <table class="min-w-full text-sm">
            <thead class="text-xs text-stone-400 tracking-widest border-b border-stone-100">
              <tr><th class="text-left py-2 pr-3 font-black">訂單</th><th class="text-left py-2 pr-3 font-black">日期</th><th class="text-left py-2 pr-3 font-black">出貨方式</th><th class="text-left py-2 pr-3 font-black">狀態</th><th class="text-right py-2 pr-3 font-black">金額</th><th class="text-right py-2 pr-3 font-black">比例</th><th class="text-right py-2 font-black">分潤</th></tr>
            </thead>
            <tbody class="divide-y divide-stone-100">
              ${rows.map(row => `<tr class="${row.cancelled ? "opacity-50" : ""}"><td class="py-2 pr-3 font-bold text-stone-800 whitespace-nowrap">${escapeHtml(row.id)}</td><td class="py-2 pr-3 text-stone-600 whitespace-nowrap">${escapeHtml(row.date || "-")}</td><td class="py-2 pr-3 text-stone-600 whitespace-nowrap">${escapeHtml(row.methodLabel)}</td><td class="py-2 pr-3 whitespace-nowrap"><span class="inline-flex items-center rounded-full border px-2 py-0.5 text-xs font-bold ${statusClass(row.status)}">${escapeHtml(row.status || "-")}</span></td><td class="py-2 pr-3 text-right mono text-stone-800 ${row.cancelled ? "line-through" : ""}">${formatCurrency(row.amount)}</td><td class="py-2 pr-3 text-right mono ${row.missingRate ? "text-red-500 font-black" : "text-stone-600"}">${row.rate}%</td><td class="py-2 text-right mono font-black text-[#5B7290] ${row.cancelled ? "line-through" : ""}">${formatCurrency(row.commission)}</td></tr>`).join("")}
            </tbody>
          </table>
        </div>
        ${cancelledCount ? `<p class="mt-3 text-xs font-bold text-stone-400">已取消訂單以刪除線標示，僅供對帳留存，不計入以上金額與分潤加總。</p>` : ""}` : `<p class="text-stone-400 font-bold">目前沒有符合條件的訂單。</p>`}

function exportRevenueShareCsv() {
  const rows = getRevenueShareRows();
  if (!rows.length) { showAdminToast("目前沒有可匯出的分潤資料。", "info"); return; }
  const header = ["訂單編號", "日期", "出貨方式", "狀態", "金額", "比例", "分潤"];
  const body = rows.map(row => [row.id, row.date, row.methodLabel, row.status, Math.round(row.amount), row.rate, Math.round(row.commission)]);
  const csv = [header].concat(body).map(row => row.map(value => `"${(value ?? "").toString().replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${document.getElementById("revenueStartDate")?.value || "revenue"}_${document.getElementById("revenueEndDate")?.value || "share"}_分潤統計.csv`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

function saveSettingsTab(btn) {
  (async () => {
    const currentSettingsMap = {};
    
    // 1. 保留所有原有的設定 (避免蓋掉其他隱藏的系統參數)
    (adminData.settings || []).forEach(r => {
      currentSettingsMap[r.setting_name] = r.value;
    });

    // 2. 覆寫日期設定
    document.querySelectorAll("#settingsDateContainer [data-setting-row]").forEach(row => {
      const key = row.querySelector('[data-key="setting_name"]').value;
      const val = row.querySelector('.setting-date-value').value.trim();
      currentSettingsMap[key] = val;
    });

    // 2-1. 覆寫日期規則
    ["pickup_min_days", "pickup_max_days", "delivery_min_days", "delivery_max_days", "order_cutoff_time", "prep_days_pickup", "prep_days_delivery"].forEach(k => {
      const el = document.getElementById("rule_" + k);
      if (el) currentSettingsMap[k] = el.value.trim();
    });

    // 3. 覆寫活動宣傳設定
    const promoKeys = ["closed_weekdays", "promo_enabled", "promo_eyebrow", "promo_title", "promo_desc", "promo_btn_text", "promo_btn_link", "promo_image", "gallery_images", "cake_intro", "cake_notice", "cake_outro", "celebration_time_slots"];
    promoKeys.forEach(k => {
       const el = document.getElementById(k);
       if (el) currentSettingsMap[k] = el.value.trim();
    });

    // 轉回陣列格式送出
    const rows = Object.keys(currentSettingsMap).map(k => ({
       setting_name: k,
       value: currentSettingsMap[k]
    }));

    await postAdmin({ action:"adminReplaceSheetRows", token:getToken(), sheetName: "Settings", rows }, `設定 已儲存。`, btn);
    clearUnsaved("settings");
  })();
}

function getSettingDates(box) {

function setSettingDates(box, dates) {

  const count = box.querySelector(".setting-date-count");
  const clean = Array.from(new Set((dates || []).map(formatDateHyphenFromInput).filter(Boolean))).sort();
  if (hidden) hidden.value = clean.join(",");

function updateSettingCalendarAndTags(box) {
  const valueInput = box.querySelector('.setting-date-value');
  const selectedDates = valueInput.value ? valueInput.value.split(',') : [];
  const calContainer = box.querySelector('.calendar-container');
  const tagsContainer = box.querySelector('.tags-container');

  let viewMonth = box.dataset.viewMonth;
  if (!viewMonth) {
      const now = new Date();
      viewMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
      box.dataset.viewMonth = viewMonth;
  }

  const [y, m] = viewMonth.split('-');
  const year = parseInt(y, 10);
  const month = parseInt(m, 10) - 1;

  let html = `
  <div class="flex items-center justify-between mb-3 bg-stone-50 rounded-xl p-1 border border-stone-100">
      <button type="button" onclick="changeCalendarMonth(this, -1)" class="calendar-nav-btn w-8 h-8 flex items-center justify-center text-stone-500 hover:bg-white rounded-lg transition-all font-black text-lg">‹</button>
      <input type="month" value="${viewMonth}" onchange="changeCalendarMonthTo(this)" class="font-black text-stone-700 bg-transparent border-none outline-none text-center cursor-pointer">
      <button type="button" onclick="changeCalendarMonth(this, 1)" class="calendar-nav-btn w-8 h-8 flex items-center justify-center text-stone-500 hover:bg-white rounded-lg transition-all font-black text-lg">›</button>
  </div>`;

  html += `<div class="grid grid-cols-7 gap-1 text-center text-xs mb-4">`;
  ['日','一','二','三','四','五','六'].forEach(day => {
      html += `<div class="font-bold text-stone-400 py-1.5">${day}</div>`;
  });

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const closedSet = new Set(getClosedWeekdays());
  const todayStr = getTodayDateInputValue();

  for(let i=0; i<firstDay; i++) { html += `<div></div>`; }
  
  for(let d=1; d<=daysInMonth; d++) {
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isSelected = selectedDates.includes(dateStr);
      const isClosed = closedSet.has(new Date(year, month, d).getDay());
      const isPast = dateStr < todayStr;
      const activeClass = isSelected
        ? 'bg-[#5B7290] text-white font-black border-[#5B7290]' + (isPast ? ' opacity-50' : '')
        : isClosed
          ? 'bg-stone-100 text-stone-300 border-stone-100 font-semibold line-through'
          : 'bg-white text-stone-700 border-stone-100 hover:border-stone-300 hover:bg-stone-50 font-semibold' + (isPast ? ' opacity-40' : '');
      html += `<button type="button" onclick="toggleCalendarDate(this, '${dateStr}')" class="calendar-day-btn aspect-square rounded-xl border flex items-center justify-center ${activeClass} transition-all text-sm">${d}</button>`;
  }
  html += `</div>`;

  html += `
  <div class="pt-4 border-t border-stone-100 grid grid-cols-2 gap-2">
      <button type="button" onclick="fillBusinessDays(this, 'month')" class="h-11 text-sm font-black text-white bg-[#5B7290] rounded-xl hover:bg-[#3E4F66]">＋ 本月營業日</button>
      <button type="button" onclick="fillBusinessDays(this, 'weeks')" class="h-11 text-sm font-black text-[#3E4F66] bg-[#eef2f7] rounded-xl hover:brightness-95">＋ 未來 4 週</button>
      <button type="button" onclick="clearMonthDates(this)" class="col-span-2 h-10 text-sm font-black text-red-500 bg-red-50 border border-red-100 rounded-xl hover:bg-red-100 transition-colors">清除本月</button>
  </div>`;
  calContainer.innerHTML = html;

  const groups = {};
  selectedDates.sort().forEach(date => {
      const my = date.substring(0, 7); 
      if(!groups[my]) groups[my] = [];
      groups[my].push(date);
  });

  if (selectedDates.length === 0) {
      tagsContainer.innerHTML = `<div class="text-stone-400 font-bold text-sm h-full flex items-center justify-center py-10">目前沒有選取任何日期</div>`;
  } else {
      let tagsHtml = '';
      for(const [grpMonth, dates] of Object.entries(groups)) {
          tagsHtml += `<div class="mb-5 last:mb-0 bg-white p-3 rounded-2xl border border-stone-200">
              <div class="text-[13px] font-black text-stone-500 tracking-widest mb-3 border-b border-stone-50 pb-2">${grpMonth.replace('-','年')}月 <span class="text-stone-400 font-bold">(${dates.length}天)</span></div>
              <div class="flex flex-wrap gap-2">
                  ${dates.map(date => {
                      const d = new Date(date);
                      const w = ['日','一','二','三','四','五','六'][d.getDay()];
                      const dayStr = date.split('-')[2];
                      return `<span class="inline-flex items-center gap-1 rounded-full border border-stone-200 bg-stone-50 px-3 py-1.5 text-sm font-black text-stone-700 hover:bg-white transition-colors">
                          ${dayStr} <span class="text-stone-400 text-xs">(${w})</span>
                          <button type="button" onclick="toggleCalendarDate(this, '${date}')" class="tag-remove-btn text-stone-400 hover:text-red-500 w-5 h-5 flex items-center justify-center rounded-full hover:bg-red-50 ml-1 transition-colors" title="移除">×</button>
                      </span>`;
                  }).join('')}
              </div>
          </div>`;
      }
      tagsContainer.innerHTML = tagsHtml;
  }
}

// ===== 每週公休日＋一鍵選取營業日 =====
const WEEKDAY_LABELS = ["日", "一", "二", "三", "四", "五", "六"];
function getClosedWeekdays() {
  const el = document.getElementById("closed_weekdays");
  const raw = el ? el.value : getSettingsVal("closed_weekdays", "1,2");
  return raw.toString().split(",").map(v => v.trim()).filter(v => v !== "" && !isNaN(v)).map(Number);
}
function closedWeekdayChipsHtml() {
  const closed = new Set(getClosedWeekdays());
  return WEEKDAY_LABELS.map((w, i) => `<button type="button" onclick="toggleClosedWeekday(${i})" class="calendar-day-btn h-11 rounded-xl border text-sm font-black ${closed.has(i) ? "bg-stone-700 text-white border-stone-700" : "bg-white text-stone-600 border-stone-200"}" aria-pressed="${closed.has(i)}">${closed.has(i) ? "休" : ""}${w}</button>`).join("");
}
function toggleClosedWeekday(i) {
  const set = new Set(getClosedWeekdays());
  set.has(i) ? set.delete(i) : set.add(i);
  document.getElementById("closed_weekdays").value = [...set].sort().join(",");
  document.getElementById("closedWeekdayChips").innerHTML = closedWeekdayChipsHtml();
  document.querySelectorAll("[data-setting-row]").forEach(updateSettingCalendarAndTags);
  markUnsaved("settings");
}
function fillBusinessDays(btn, mode) {
  const box = btn.closest("[data-setting-row]");
  const closed = new Set(getClosedWeekdays());
  const today = getTodayDateInputValue();
  let start, end;
  if (mode === "month") {
    const [y, m] = box.dataset.viewMonth.split("-").map(Number);
    start = `${box.dataset.viewMonth}-01`;
    end = `${box.dataset.viewMonth}-${String(new Date(y, m, 0).getDate()).padStart(2, "0")}`;
    if (start < today) start = today;
  } else { start = today; end = addDaysToDateInput(today, 27); }
  const add = [];
  for (let d = start; d && d <= end; d = addDaysToDateInput(d, 1)) {
    if (!closed.has(new Date(d + "T00:00:00").getDay())) add.push(d);
  }
  const before = getSettingDates(box);
  const merged = Array.from(new Set(before.concat(add)));
  setSettingDates(box, merged);
  markUnsaved("settings");
  updateSettingCalendarAndTags(box);
  const added = merged.length - before.length;
  showAdminToast(added ? `已加入 ${added} 天（自動跳過公休日與已過去的日期）` : "這段期間的營業日都已經選好了", added ? "success" : "info", 2600);
}

function toggleCalendarDate(btn, dateStr) {
  const box = btn.closest('[data-setting-row]');
  let dates = getSettingDates(box);
  if (dates.includes(dateStr)) {
      dates = dates.filter(d => d !== dateStr);
  } else {
      dates.push(dateStr);
  }
  setSettingDates(box, dates);
  markUnsaved('settings');
  updateSettingCalendarAndTags(box);
}

function changeCalendarMonth(btn, delta) {
  const box = btn.closest('[data-setting-row]');
  let [y, m] = box.dataset.viewMonth.split('-');
  let date = new Date(y, m - 1 + delta, 1);
  box.dataset.viewMonth = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
  updateSettingCalendarAndTags(box);
}

function changeCalendarMonthTo(input) {
  if(!input.value) return;
  const box = input.closest('[data-setting-row]');
  box.dataset.viewMonth = input.value;
  updateSettingCalendarAndTags(box);
}

function clearMonthDates(btn) {
  showAdminConfirm("確定要清除本月的所有日期設定嗎？", () => {
    const box = btn.closest('[data-setting-row]');
    const [y, m] = box.dataset.viewMonth.split('-');
    const prefix = `${y}-${m}-`;
    let dates = getSettingDates(box).filter(d => !d.startsWith(prefix));
    setSettingDates(box, dates);
    markUnsaved('settings');
    updateSettingCalendarAndTags(box);
  }, "清除確認");
}

function copyDatesFromSetting(btn, sourceLabel) {
  const box = btn.closest('[data-setting-row]');
  const targetLabel = box.dataset.settingName;
  const sourceBox = document.querySelector(`[data-setting-row][data-setting-name="${sourceLabel}"]`);
  
  if (!sourceBox) return;

  showAdminConfirm(`確定要將【${sourceLabel}】的日期完全覆蓋到【${targetLabel}】嗎？\n(此操作將會清除原本的設定)`, () => {
      const sourceDates = getSettingDates(sourceBox);
      setSettingDates(box, sourceDates);
      markUnsaved('settings');
      updateSettingCalendarAndTags(box);
      showAdminToast(`已成功從 ${sourceLabel} 複製日期`, 'success');
  }, "複製設定");
}

function clearSettingDates(button) {
  showAdminConfirm("確定要清空所有日期設定嗎？這會刪除所有月份的資料。", () => {
    const box = button.closest('[data-setting-row]');
    setSettingDates(box, []);
    markUnsaved('settings');
    updateSettingCalendarAndTags(box);
  }, "清空所有日期");
}

// ===== 上傳照片到 GitHub：先在瀏覽器壓縮，再交給後端存進 repo 的 images/uploads =====
const imagePreviewMap = {};   // 剛上傳的照片：GitHub 網站約 1 分鐘才更新，先用原始檔網址預覽
function previewSrc(url) { return imagePreviewMap[url] || url; }
function thumbSrc(url) { return imagePreviewMap[url] || (/^images\/uploads\/[^/]+\.jpg$/.test(url) && !/-s\.jpg$/.test(url) ? url.replace(/\.jpg$/, "-s.jpg") : url); }
function thumbImgHtml(url) { return `<img src="${escapeHtml(thumbSrc(url))}" data-full="${escapeHtml(previewSrc(url))}" onerror="if(this.dataset.full&&this.src.indexOf(this.dataset.full)<0){this.src=this.dataset.full}" alt="" loading="lazy">`; }
// 讀照片 → 依需要縮小並壓縮；maxBytes 會自動降畫質／尺寸，讓檔案不超過上限
function loadImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("讀取照片失敗"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("無法讀取這張照片，請換一張"));
      img.onload = () => resolve(img);
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function imageToJpeg(img, maxSize, quality, square) {
  const canvas = document.createElement("canvas");
  let sx = 0, sy = 0, sw = img.width, sh = img.height;
  if (square) { const side = Math.min(img.width, img.height); sx = (img.width - side) / 2; sy = (img.height - side) / 2; sw = sh = side; }
  const scale = Math.min(1, maxSize / Math.max(sw, sh));
  canvas.width = Math.round(sw * scale);
  canvas.height = Math.round(sh * scale);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", quality);
}
function dataUrlBytes(dataUrl) { return Math.round((dataUrl.length - dataUrl.indexOf(",") - 1) * 0.75); }
function compressToLimit(img, maxSize, maxBytes) {
  const tries = [[maxSize, 0.82], [maxSize, 0.74], [maxSize, 0.66], [Math.round(maxSize * 0.85), 0.66], [Math.round(maxSize * 0.7), 0.62]];
  let out = "";
  for (const [size, q] of tries) { out = imageToJpeg(img, size, q); if (dataUrlBytes(out) <= maxBytes) break; }
  return out;
}
async function compressImageFile(file, maxSize = 1200) {
  const img = await loadImageFile(file);
  return compressToLimit(img, maxSize, maxSize >= 1600 ? 400 * 1024 : 250 * 1024);
}
// withThumb：商品照片另外產生 240px 正方形小圖（前台縮圖用，約 10～25KB）
async function uploadImageToGithub(file, maxSize, withThumb) {
  const img = await loadImageFile(file);
  const dataUrl = compressToLimit(img, maxSize, maxSize >= 1600 ? 400 * 1024 : 250 * 1024);
  const payload = { action: "adminUploadImage", token: getToken(), base64: dataUrl };
  if (withThumb) payload.thumbBase64 = imageToJpeg(img, 240, 0.78, true);
  const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
  const data = await res.json();
  if (data.status !== "success") throw new Error(data.message || "上傳失敗");
  imagePreviewMap[data.url] = data.preview || data.url;
  return data.url;
}
async function withUploadToast(label, fn) {
  const t = showAdminToast(label, "loading", 0);
  try { const r = await fn(); removeAdminToast(t); return r; }
  catch (err) { removeAdminToast(t); showAdminToast("上傳失敗：" + err.message, "error", 5200); return null; }
}
async function uploadProductImage(fileInput) {
  const file = fileInput.files && fileInput.files[0]; fileInput.value = "";
  if (!file) return;
  const url = await withUploadToast("照片上傳中...", () => uploadImageToGithub(file, 1200, true));
  if (!url) return;

  if (field) { field.value = url; refreshImagePreview(field); }

}

async function uploadGalleryImages(fileInput) {

}

function moveGalleryImage(i, dir) {

function removeGalleryImage(i) {
  const list = getGalleryList();
  list.splice(i, 1);
  setGalleryList(list);

function isDisplayOn(value) {
  const v = (value ?? "").toString().trim().toUpperCase();
  return v !== "FALSE" && v !== "0" && v !== "下架";
}

function renderDisplaySwitch(on) {
  return `<button type="button" onclick="toggleDisplaySwitch(this)" class="admin-switch ${on ? "is-on" : ""}" aria-label="${on ? "上架" : "下架"}" title="${on ? "上架" : "下架"}"><span></span></button>`;
}

function toggleDisplaySwitch(button) {
  const input = button.parentElement.querySelector('input[data-key="display"]');
  const nextOn = !button.classList.contains("is-on");
  button.classList.toggle("is-on", nextOn);
  button.setAttribute("aria-label", nextOn ? "上架" : "下架");
  button.setAttribute("title", nextOn ? "上架" : "下架");
  if (input) input.value = nextOn ? "TRUE" : "FALSE";
  
  const row = button.closest("tr");
  updateEditableRowState(row);
  
  const table = button.closest("table[data-edit-table]");
  if (table) {
    updateEditableTableStats(table.dataset.editTable);
    markUnsaved(table.dataset.editTable);
  }
}

function updateEditableRowState(row) {
  if (!row) return;

  const displayInput = row.querySelector('input[data-key="display"]');
  if (displayInput) {
    const on = isDisplayOn(displayInput.value);
    row.classList.toggle("is-inactive", !on);
    const tag = row.querySelector('.mobile-status-tag');
    if (tag) {
      tag.textContent = on ? "上架中" : "已下架";
      tag.className = `mobile-status-tag md:hidden inline-block ml-2 px-2 py-0.5 text-[10px] font-bold border rounded-full align-text-bottom mb-1 ${on ? "bg-emerald-50 text-emerald-600 border-emerald-200" : "bg-red-50 text-red-600 border-red-200"}`;
    }
  }
  
  const codeInput = row.querySelector('input[data-key="code"]');
  if (codeInput) {
    const startDateInput = row.querySelector('input[data-key="start_date"]');
    const endDateInput = row.querySelector('input[data-key="end_date"]');
    const tag = row.querySelector('.mobile-status-tag');
    if (tag && startDateInput && endDateInput) {
      const today = getTodayDateInputValue();
      const start = startDateInput.value;
      const end = endDateInput.value;
      
      let tagClass = "bg-emerald-50 text-emerald-600 border-emerald-200";
      let tagText = "進行中";
      
      if (start && today < start) {
        tagClass = "bg-blue-50 text-blue-600 border-blue-200";
        tagText = "尚未開始";
      } else if (end && today > end) {
        tagClass = "bg-stone-50 text-stone-500 border-stone-200";
        tagText = "已結束";
      } else if (end) {
        const diff = Math.ceil((new Date(end + "T00:00:00") - new Date(today + "T00:00:00")) / (24 * 60 * 60 * 1000));
        if (diff <= 7) {
          tagClass = "bg-amber-50 text-amber-600 border-amber-200";
          tagText = `剩 ${diff} 天`;
        }
      }
      tag.textContent = tagText;
      tag.className = `mobile-status-tag md:hidden inline-block ml-2 px-2 py-0.5 text-[10px] font-bold border rounded-full align-text-bottom mb-1 ${tagClass}`;
    }
  }

  const stockInput = row.querySelector('input[data-key="stock"]');
  if (stockInput) updateStockInputClass(stockInput);
}

function stockInputClass(value) {
  const n = Number(value || 0);
  if (!isNaN(n) && n <= 0) return "admin-stock-zero";
  if (!isNaN(n) && n <= 5) return "admin-stock-low";
  return "";
}

function updateStockInputClass(input) {
  if (!input) return;
  input.classList.remove("admin-stock-zero", "admin-stock-low");
  const cls = stockInputClass(input.value);
  if (cls) input.classList.add(cls);
}

function getEditableTableStats(rows) {
  const list = rows || [];
  const total = list.length;
  const active = list.filter(row => isDisplayOn(row.display === undefined || row.display === "" ? "TRUE" : row.display)).length;
  return { total, active, inactive: total - active };
}

function updateEditableTableStats(tab) {
  if (!(tab === "products" || tab === "packaging" || tab === "categories")) return;
  const table = document.querySelector(`[data-edit-table="${tab}"]`);
  const statsEl = document.getElementById(`${tab}Stats`);
  if (!table || !statsEl) return;
  const rows = [...table.querySelectorAll("tbody tr")];
  const total = rows.length;
  const active = rows.filter(row => {
    const input = row.querySelector('input[data-key="display"]');
    return !input || isDisplayOn(input.value);
  }).length;
  const label = tab === "products" ? "商品" : tab === "packaging" ? "包裝" : "分類";
  statsEl.textContent = `共 ${total} 個${label}｜上架 ${active}｜下架 ${total - active}`;
}

function filterEditableTable(tab) {
  const table = document.querySelector(`[data-edit-table="${tab}"]`);
  const input = document.getElementById(`${tab}Search`);
  const statusSelect = document.getElementById(`${tab}DisplayFilter`);
  if (!table || !input) return;
  
  const q = input.value.trim().toLowerCase();
  const statusFilter = statusSelect ? statusSelect.value : "";
  
  table.querySelectorAll("tbody tr").forEach(row => {
    const fields = Array.from(row.querySelectorAll("input, select, textarea"));
    const text = fields.map(f => f.value).join(" ").toLowerCase();
    const textMatch = !q || text.includes(q);
    
    let statusMatch = true;
    if (statusFilter) {
      const displayInput = row.querySelector('input[data-key="display"]');
      if (displayInput) {
        const isOn = isDisplayOn(displayInput.value);
        if (statusFilter === "ON" && !isOn) statusMatch = false;
        if (statusFilter === "OFF" && isOn) statusMatch = false;
      }
    }
    
    row.style.display = (textMatch && statusMatch) ? "" : "none";
  });
}

function addRow(tab) {
  let table = document.querySelector(`[data-edit-table="${tab}"]`);
  // Handle settings list fallback
  if (!table && tab === "settings") {
    table = document.querySelector(`[data-edit-table="settings_list"]`);
  }
  
  const keys = table.dataset.keys.split(",");
  const labels = (table.dataset.labels || "").split(",");
  const textareaLong = tab === "settings";
  const defaults = tab === "categories" ? { id: "c_" + Date.now(), behavior: "combo", display: "TRUE", sort: "10" } : tab === "products" ? { type: "combo", display: "TRUE", shipping_rule: "all", sort: "10" } : tab === "packaging" ? { type: "combo", display: "TRUE", sort: "10" } : {};
  table.querySelector("tbody").insertAdjacentHTML("beforeend", editRowHtml(tab, keys, defaults, textareaLong, labels));
  
  const newRow = table.querySelector("tbody tr:last-child");
  updateEditableRowState(newRow);
  updateEditableTableStats(tab);
  markUnsaved(tab);

  showAdminToast("已新增一列於最下方，請記得儲存", "success", 2500);
  
  requestAnimationFrame(() => {
    newRow.scrollIntoView({ behavior: "smooth", block: "center" });
    
    const originalShadow = newRow.style.boxShadow;
    const originalBg = newRow.style.backgroundColor;
    newRow.style.boxShadow = "0 0 0 3px rgba(91, 114, 144, .3)";
    newRow.style.backgroundColor = "#f8fafc";
    
    setTimeout(() => {
      newRow.style.boxShadow = originalShadow;
      newRow.style.backgroundColor = originalBg;
    }, 1800);
  });
}

function collectRows(tab) {
  let table = document.querySelector(`[data-edit-table="${tab}"]`);
  
  if (tab === "settings") {
    // 組合視覺化日期與條列式設定
    const listTable = document.querySelector(`[data-edit-table="settings_list"]`);
    const dateRows = [...document.querySelectorAll("[data-setting-row]")].map(row => {
      return {
        setting_name: row.querySelector(`[data-key="setting_name"]`).value.trim(),
        value: row.querySelector(`[data-key="value"]`).value.trim()
      };
    });
    const listRows = [...listTable.querySelectorAll("tbody tr")].map(tr => {
      return {
        setting_name: tr.querySelector(`[data-key="setting_name"]`)?.value.trim() || "",
        value: tr.querySelector(`[data-key="value"]`)?.value.trim() || ""
      };
    });
    return [...dateRows, ...listRows];
  }

  const keys = table.dataset.keys.split(",");
  return [...table.querySelectorAll("tbody tr")].map(tr => {
    const obj = {};
    keys.forEach(key => {
      const input = tr.querySelector(`[data-key="${key}"]`);
      obj[key] = input ? input.value.trim() : "";
    });
    return obj;
  });
}

function openOrderFromDashboard(orderId) {
  switchTab("orders");
  ["orderStatusFilter", "orderMethodFilter", "orderStartDate", "orderEndDate"].forEach(k => { const el = document.getElementById(k); if (el) el.value = ""; });
  updateOrderRangeButtons("");
  const searchInput = document.getElementById("orderSearch");
  if (searchInput) searchInput.value = orderId;
  filterOrders();
  openOrderDetail(orderId);
}

function saveSheet(tab, sheetName, btnElement) {
  showAdminConfirm(`確定要儲存「${sheetName}」的變更嗎？`, async () => {
    const rows = collectRows(tab);
    await postAdmin({ action:"adminReplaceSheetRows", token:getToken(), sheetName, rows }, `${sheetName} 已儲存。`, btnElement);
    clearUnsaved(tab);
  }, "儲存確認");
}

async function postAdmin(payload, successMessage, buttonElement = null) {
  const restoreButton = setButtonLoading(buttonElement || getActiveActionButton(), "儲存中...");
  const loadingToast = showAdminToast("儲存中...", "loading", 0);
  hideAdminInlineMessage();
  try {
    const res = await fetch(API_URL, { method:"POST", body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.status !== "success") {
      hideAdminInlineMessage();
      removeAdminToast(loadingToast);
      showAdminToast(data.message || "儲存失敗。", "error", 4200);
      return;
    }
    const cleanMessage = (successMessage || data.message || "已儲存。").replace(/。$/, "");
    hideAdminInlineMessage();
    removeAdminToast(loadingToast);
    showAdminToast(cleanMessage, "success");
    await loadAll();
  } catch (err) {
    hideAdminInlineMessage();
    removeAdminToast(loadingToast);
    showAdminToast("儲存失敗：" + err.message, "error", 4200);
  } finally {
    if (restoreButton) restoreButton();
  }
}

document.getElementById("adminPassword").addEventListener("keydown", e => { if (e.key === "Enter") adminLogin(); });
if (getToken()) { setLoggedInState(true); loadAll(); }
window.addEventListener("resize", () => {
  syncOrderFilterDetails();
  if (adminData && document.getElementById("ordersArea") && isWideOrders() !== orderUi.wide) { closeOrderDetail(); filterOrders(); }
});

let lastScrollY = window.scrollY;

window.addEventListener('scroll', () => {
  const tabMenu = document.getElementById('tabMenu');
  if (!tabMenu) return;

  const currentScrollY = window.scrollY;
  
  if (currentScrollY > lastScrollY + 10 && currentScrollY > 100) {
    tabMenu.classList.add('tab-menu-hidden');
    lastScrollY = currentScrollY;
  } 
  else if (currentScrollY < lastScrollY - 10 || currentScrollY < 50) {
    tabMenu.classList.remove('tab-menu-hidden');
    lastScrollY = currentScrollY;
  }
}, { passive: true });
